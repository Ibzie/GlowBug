{% extends "base.html" %}
{% block title %}Log in · GlowBug{% endblock %}
{% block content %}
<div class="narrow">
    <div class="hero">
        <p class="eyebrow">Welcome back</p>
        <h1>Log in to GlowBug</h1>
    </div>

    <form method="post" action="/login" class="card form">
        <label class="field">
            <span>Email</span>
            <input type="email" name="email" value="{{ email or '' }}" autocomplete="username" required autofocus>
        </label>
        <label class="field">
            <span>Password</span>
            <input type="password" name="password" autocomplete="current-password" required>
        </label>
        <div class="actions">
            <button class="btn" type="submit">Log in{{ icon("arrow-right") }}</button>
        </div>
    </form>
</div>
{% endblock %}
