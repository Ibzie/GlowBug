services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: glowbug
      POSTGRES_PASSWORD: glowbug
      POSTGRES_DB: glowbug
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glowbug -d glowbug"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: .
    command:
      - sh
      - -c
      - uv run --no-sync alembic upgrade head && uv run --no-sync glowbug currency seed
    environment:
      APP_ENV: development
      DEBUG: "true"
      SECRET_KEY: change-me-in-production
      DATABASE_URL: postgresql+asyncpg://glowbug:glowbug@db:5432/glowbug
      REDIS_URL: redis://redis:6379/0
      TZ: UTC
    depends_on:
      db:
        condition: service_healthy

  web:
    build: .
    environment:
      APP_ENV: development
      DEBUG: "true"
      SECRET_KEY: change-me-in-production
      DATABASE_URL: postgresql+asyncpg://glowbug:glowbug@db:5432/glowbug
      REDIS_URL: redis://redis:6379/0
      TZ: UTC
      OCR_LANGUAGE: ${OCR_LANGUAGE:-eng}
      OCR_SCALE: ${OCR_SCALE:-4}
      OCR_MIN_CONFIDENCE: ${OCR_MIN_CONFIDENCE:-20}
      OCR_PSM: ${OCR_PSM:-6}
      OCR_MAX_PAGES: ${OCR_MAX_PAGES:-25}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build: .
    command:
      [
        "uv",
        "run",
        "--no-sync",
        "taskiq",
        "worker",
        "glowbug.jobs.broker:broker",
        "glowbug.jobs.tasks",
        "glowbug.jobs.fx",
      ]
    environment:
      APP_ENV: development
      DEBUG: "true"
      SECRET_KEY: change-me-in-production
      DATABASE_URL: postgresql+asyncpg://glowbug:glowbug@db:5432/glowbug
      REDIS_URL: redis://redis:6379/0
      TZ: UTC
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  scheduler:
    build: .
    command:
      [
        "uv",
        "run",
        "--no-sync",
        "taskiq",
        "scheduler",
        "glowbug.jobs.scheduler:scheduler",
        "glowbug.jobs.tasks",
        "glowbug.jobs.fx",
      ]
    environment:
      APP_ENV: development
      DEBUG: "true"
      SECRET_KEY: change-me-in-production
      DATABASE_URL: postgresql+asyncpg://glowbug:glowbug@db:5432/glowbug
      REDIS_URL: redis://redis:6379/0
      TZ: UTC
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
